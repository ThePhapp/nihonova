name: jlpt-platform-tests
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jlpt_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: jlpt_test
    ports:
      - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jlpt_test -d jlpt_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Isolated test data only; stop/start resets this database.
    tmpfs:
      - /var/lib/postgresql/data
